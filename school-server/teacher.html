<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAS Class Tests</title>
<style>
  :root {
    --bg: #F4EFE6; --card: #FFFFFF; --sunken: #FAF6EF; --line: #E2D9CC;
    --ink: #1C1208; --ink2: #4A3F32; --muted: #6E6253;
    --brand: #145C44; --brand-ink: #FFFFFF; --brand-soft: #E8F4EE;
    --gold: #9A6F1E; --gold-soft: #F7EDDA; --bad: #B83232; --bad-soft: #FBEAEA;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1A0C; --card: #16241A; --sunken: #122013; --line: #2E4230;
      --ink: #EEE8DF; --ink2: #B8B0A2; --muted: #A8A091;
      --brand: #2D8A63; --brand-ink: #FFFFFF; --brand-soft: #1C3A2B;
      --gold: #E8A63C; --gold-soft: #372C15; --bad: #F08B7E; --bad-soft: #371515;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; } h2 { margin: 0; font-size: 17px; } p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  button, .btn { min-height: 44px; padding: 0 16px; border-radius: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  button.danger { color: var(--bad); }
  button.link { border: none; background: none; padding: 0; min-height: 0; color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: 13px; font-weight: 600; color: var(--ink2); display: grid; gap: 4px; }
  input, select, textarea { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 15px system-ui, sans-serif; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: 20px; height: 20px; min-height: 0; accent-color: var(--brand); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .tag.open { background: var(--brand-soft); color: var(--brand); }
  .tag.draft { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
  .tag.closed { background: var(--gold-soft); color: var(--gold); }
  .msg { font-size: 14px; padding: 8px 12px; border-radius: 10px; }
  .msg.ok { background: var(--brand-soft); color: var(--brand); } .msg.bad { background: var(--bad-soft); color: var(--bad); } .msg.info { background: var(--gold-soft); color: var(--gold); }
  .q { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: var(--sunken); }
  .opt { display: grid; grid-template-columns: 24px 18px 1fr auto; gap: 8px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; } td { border-top: 1px solid var(--line); padding: 8px; vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  .big { font-size: 26px; font-weight: 800; }
  .stat { background: var(--sunken); border-radius: 12px; padding: 12px; }
  [hidden] { display: none !important; }
  .pics { display: flex; flex-wrap: wrap; gap: 10px; }
  .pics figure { margin: 0; display: grid; gap: 4px; width: 220px; }
  .pics img, .optimg img { max-width: 200px; max-height: 150px; border-radius: 8px; border: 1px solid var(--line); background: #fff; object-fit: contain; }
  .pics figcaption { font-size: 13px; color: var(--muted); }
  .optimg { display: flex; align-items: center; gap: 8px; margin: -2px 0 4px 50px; }
  .opt > :nth-child(4):empty { display: none; }
  code { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .ticks { display: flex; flex-wrap: wrap; gap: 8px; }
  .ticks label { display: flex; align-items: center; gap: 6px; font-weight: 400; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--card); min-height: 40px; cursor: pointer; }
  .ticks label.all { font-weight: 700; }
  .pick { display: grid; gap: 6px; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .pick label { font-weight: 400; color: var(--ink); display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 6px; border-radius: 8px; }
  .pick label:hover { background: var(--sunken); }
</style>
</head>
<body>
<main>
  <!-- Sign in -->
  <section id="v-login" class="card" style="max-width:420px;margin:40px auto 0" hidden>
    <div><h1>Offline Assessment</h1><p class="muted">Sign in with your CAS teacher code and password.</p></div>
    <form id="loginform" class="grid" style="grid-template-columns:1fr">
      <label>Teacher code<input id="lcode" autocomplete="username" autocapitalize="characters" required></label>
      <label>Password<input id="lpass" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit" id="lbtn">Sign in</button>
      <div id="lmsg" role="alert"></div>
    </form>
  </section>

  <!-- Header -->
  <header id="top" class="row between" hidden>
    <div><h1>Offline Assessment</h1><p class="muted" id="whoami"></p></div>
    <div class="row"><button id="newtest" class="primary">New test</button><button id="signout">Sign out</button></div>
  </header>

  <!-- My tests -->
  <section id="v-list" hidden>
    <div id="tests" style="display:grid;gap:12px"></div>
  </section>

  <!-- Editor -->
  <section id="v-edit" class="card" hidden>
    <div class="row between"><h2 id="edtitle">New test</h2><button class="link" id="edback">Back to my tests</button></div>
    <div class="grid">
      <label>Title<input id="ftitle" placeholder="Week 6 quiz"></label>
      <label>Subject<select id="fsubject"></select></label>
      <label>Record as<select id="frecord"></select></label>
      <label>Time limit<select id="ftime">
        <option value="">No time limit</option>
        <option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option>
        <option value="20">20 minutes</option><option value="25">25 minutes</option><option value="30">30 minutes</option>
        <option value="40">40 minutes</option><option value="45">45 minutes</option><option value="50">50 minutes</option>
        <option value="60">1 hour</option><option value="75">1 hour 15 minutes</option><option value="90">1 hour 30 minutes</option>
        <option value="120">2 hours</option><option value="150">2 hours 30 minutes</option><option value="180">3 hours</option>
      </select></label>
    </div>
    <div><strong>Classes</strong> <span class="muted" id="fclasshint">Tick every class taking it, for merged classes too.</span>
      <div class="ticks" id="fclasses" style="margin-top:6px"></div></div>
    <p class="muted" id="frecordhint"></p>
    <label>Instructions (optional)<textarea id="finstr"></textarea></label>
    <div class="row">
      <label class="row" style="display:flex;font-weight:400"><input type="checkbox" id="fshow" checked> Show students the answers after they submit</label>
      <label class="row" style="display:flex;font-weight:400"><input type="checkbox" id="frand"> Shuffle the question order</label>
    </div>
    <div class="row between"><h2>Questions <span class="muted" id="qcount"></span></h2>
      <div class="row"><button id="addmcq">Add objective</button><button id="addshort">Add short answer</button><button id="addpasco">Add from Past Questions</button></div></div>
    <div id="pasco" class="card" hidden style="background:var(--sunken)">
      <div class="row between"><strong>Add from Past Questions</strong><button class="link" id="pclose">Close</button></div>
      <select id="psubject"></select>
      <div id="plist" class="pick"></div>
      <div class="row"><button class="primary" id="padd">Add selected</button><span class="muted" id="pnote"></span></div>
    </div>
    <input type="file" id="imgfile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <div id="qs" style="display:grid;gap:10px"></div>
    <div id="edmsg" role="alert"></div>
    <div class="row"><button class="primary" id="saveopen">Save and open for students</button><button id="savedraft">Save as draft</button></div>
  </section>

  <!-- Results -->
  <section id="v-res" hidden style="display:grid;gap:16px">
    <div class="row between"><div><h2 id="rtitle"></h2><p class="muted" id="rsub"></p></div>
      <div class="row"><button class="link" id="rback">Back to my tests</button></div></div>
    <div class="grid" id="rstats"></div>
    <div class="row" id="ractions"></div>
    <div class="card" id="rmarkcard" hidden><h2>Short answers to mark</h2><div id="rmark" style="display:grid;gap:10px"></div></div>
    <div class="card"><div class="row between"><h2>Students</h2><button id="rcsv">Download Excel (CSV)</button></div>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>Student ID</th><th>Class</th><th>Status</th><th>Score</th></tr></thead><tbody id="rrows"></tbody></table></div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LET = ['A', 'B', 'C', 'D', 'E'];
let token = null; try { token = localStorage.getItem('cas_teacher_token'); } catch {}
let me = null, editing = null, draft = null, resTimer = null, resId = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { Authorization: `Bearer ${token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (r.status === 401) { signOut(); throw new Error('Sign in again.'); }
  const d = r.headers.get('content-type')?.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}
function msg(el, text, tone) { el.innerHTML = text ? `<div class="msg ${tone}">${esc(text)}</div>` : ''; }
function show(view) { for (const v of ['v-login', 'v-list', 'v-edit', 'v-res']) $(v).hidden = v !== view; $('top').hidden = view === 'v-login'; if (view !== 'v-res') { clearInterval(resTimer); resTimer = null; } }

// ── Sign in ──
$('loginform').onsubmit = async (e) => {
  e.preventDefault(); $('lbtn').disabled = true; msg($('lmsg'), '', '');
  try {
    const r = await fetch('/lms/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'teacher', code: $('lcode').value, password: $('lpass').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    token = d.token; try { localStorage.setItem('cas_teacher_token', token); } catch {}
    $('lpass').value = ''; start();
  } catch (err) { msg($('lmsg'), err.message || 'Could not sign in.', 'bad'); }
  finally { $('lbtn').disabled = false; }
};
function signOut() {
  if (token) fetch('/lms/logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } }).catch(() => {});
  token = null; try { localStorage.removeItem('cas_teacher_token'); } catch {}
  show('v-login');
}
$('signout').onclick = signOut;

async function start() {
  if (!token) return show('v-login');
  try { me = await api('/lms/teacher/me'); } catch { return; }
  const sync = me.online;
  $('whoami').textContent = `${me.name}. ` + (sync ? (sync.ok ? `Last sent to CAS ${new Date(sync.at).toLocaleString()}.` : sync.message) : 'Not yet synced with CAS.');
  $('fsubject').innerHTML = me.subjects.length
    ? '<option value="">Choose a subject</option>' + me.subjects.map(x => `<option>${esc(x.subject)}</option>`).join('')
    : '<option value="">No lessons on your timetable yet</option>';
  $('frecord').innerHTML = me.modes.map(m => `<option value="ca:${esc(m.id)}">${esc(m.name)}</option>`).join('')
    + '<option value="exam">End-of-semester exam</option><option value="none">Practice (not recorded)</option>';
  listTests();
}

// ── My tests ──
async function listTests() {
  show('v-list');
  const tests = await api('/lms/teacher/tests');
  $('tests').innerHTML = tests.length ? tests.map(t => `
    <article class="card">
      <div class="row between">
        <div><h2>${esc(t.title)}</h2>
          <p class="muted">${esc(t.class_name)}, ${esc(t.subject)}. ${t.question_count} question${t.question_count === 1 ? '' : 's'}${t.time_limit_mins ? `, ${t.time_limit_mins} min` : ''}${t.origin === 'cloud' ? '. Made in CAS' : ''}</p></div>
        <span class="tag ${t.status}">${{ draft: 'Draft', open: 'Open', closed: 'Closed' }[t.status]}</span>
      </div>
      <p>${t.submitted} of ${t.class_size} submitted${t.started ? `, ${t.started} taking it now` : ''}${t.to_mark ? `. <strong>${t.to_mark} answer${t.to_mark === 1 ? '' : 's'} to mark</strong>` : ''}</p>
      ${t.status !== 'draft' ? `<p class="muted">${t.waiting_for_cas ? 'Results waiting to be sent to CAS (the server sends them when it is online).' : 'Results sent to CAS.'}</p>` : ''}
      ${t.origin === 'local' ? `<p class="muted">${t.record_as === 'ca' ? `Recorded in Assessments as ${esc(t.mode_name || 'a CA assessment')} when you close it.` : t.record_as === 'exam' ? 'Recorded in Assessments as the end-of-semester exam when you close it.' : 'Practice: not recorded in Assessments.'}${t.record_note ? ` ${esc(t.record_note)}` : ''}</p>` : ''}
      ${t.removed_in_cas ? '<p class="muted">This test was removed in CAS.</p>' : ''}
      <div class="row">
        ${t.status === 'open' ? `<button data-status="closed" data-id="${t.id}">Close test</button>` : `<button class="primary" data-status="open" data-id="${t.id}" ${t.removed_in_cas ? 'disabled' : ''}>${t.status === 'closed' ? 'Open again' : 'Open for students'}</button>`}
        ${t.status !== 'draft' ? `<button data-results="${t.id}">Results</button>` : ''}
        ${t.origin === 'local' && t.submitted + t.started === 0 ? `<button data-edit="${t.id}">Edit</button>` : ''}
        ${t.origin === 'local' && t.submitted + t.started === 0 ? `<span data-del="${t.id}"><button class="danger">Delete</button></span>` : ''}
      </div>
    </article>`).join('') : `<div class="card"><h2>No tests yet</h2><p class="muted">Tests you make here, and published LMS quizzes for your classes in CAS, appear here. Students on the school Wi-Fi see a test once you open it.</p></div>`;
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.status) { await api(`/lms/teacher/tests/${b.dataset.id}/status`, { method: 'POST', body: JSON.stringify({ status: b.dataset.status }) }); listTests(); }
    else if (b.dataset.results) openResults(b.dataset.results);
    else if (b.dataset.edit) openEditor(b.dataset.edit);
    else if (b.closest('[data-del]') && !b.dataset.yes && !b.dataset.no) {
      const wrap = b.closest('[data-del]');
      wrap.innerHTML = `<span class="muted">Delete this test?</span> <button class="danger" data-yes="1">Delete</button> <button data-no="1">Cancel</button>`;
    } else if (b.dataset.yes) { await api(`/lms/teacher/tests/${b.closest('[data-del]').dataset.del}`, { method: 'DELETE' }); listTests(); }
    else if (b.dataset.no) listTests();
  } catch (err) { alertInline(err.message); }
});
function alertInline(text) { const d = document.createElement('div'); d.className = 'msg bad'; d.textContent = text; $('tests').prepend(d); setTimeout(() => d.remove(), 5000); }

// ── Editor ──
$('newtest').onclick = () => openEditor(null);
$('edback').onclick = () => listTests();
function blankQ(type) { return type === 'short' ? { type: 'short', text: '', marks: 2, explanation: '', images: [] } : { type: 'mcq', text: '', options: ['', '', '', ''], option_images: [], correct: '', marks: 1, explanation: '', images: [] }; }
async function openEditor(id) {
  editing = id; msg($('edmsg'), '', ''); $('pasco').hidden = true;
  if (id) {
    const t = await api(`/lms/teacher/tests/${id}`);
    draft = { title: t.title, class_names: t.class_names || [], subject: t.subject, record: t.record_as === 'ca' ? `ca:${t.mode_id}` : t.record_as === 'exam' ? 'exam' : 'none',
      time_limit_mins: t.time_limit_mins || '', instructions: t.instructions || '',
      show_answers: !!t.show_answers, randomise: !!t.randomise, questions: t.questions.map(q => ({ type: q.type, text: q.text, options: q.options, correct: q.correct, marks: q.marks, explanation: q.explanation || '',
        images: q.images || [], option_images: q.option_images || [] })) };
  } else draft = { title: '', class_names: [], subject: me.subjects.length === 1 ? me.subjects[0].subject : '', record: me.modes.length ? `ca:${me.modes[0].id}` : 'none',
    time_limit_mins: '', instructions: '', show_answers: true, randomise: false, questions: [blankQ('mcq')] };
  $('edtitle').textContent = id ? 'Edit test' : 'New test';
  $('ftitle').value = draft.title; $('fsubject').value = draft.subject; $('frecord').value = draft.record;
  renderClasses(); recordHint();
  if (draft.time_limit_mins && ![...$('ftime').options].some(o => o.value === String(draft.time_limit_mins))) $('ftime').insertAdjacentHTML('beforeend', `<option value="${esc(draft.time_limit_mins)}">${esc(draft.time_limit_mins)} minutes</option>`);
  $('ftime').value = String(draft.time_limit_mins || ''); $('finstr').value = draft.instructions; $('fshow').checked = draft.show_answers; $('frand').checked = draft.randomise;
  renderQs(); show('v-edit');
}
function renderClasses() {
  const subj = me.subjects.find(x => x.subject === $('fsubject').value);
  if (!subj) { $('fclasses').innerHTML = `<span class="muted">${me.subjects.length ? 'Choose the subject first.' : 'Ask the admin to put your lessons on the timetable in CAS.'}</span>`; return; }
  const ticked = new Set(draft.class_names);
  const all = subj.classes.length > 1 && subj.classes.every(c => ticked.has(c));
  $('fclasses').innerHTML = (subj.classes.length > 1 ? `<label class="all"><input type="checkbox" data-allcls ${all ? 'checked' : ''}> All my classes</label>` : '')
    + subj.classes.map(c => `<label><input type="checkbox" data-cls="${esc(c)}" ${ticked.has(c) || subj.classes.length === 1 ? 'checked' : ''}> ${esc(c)}</label>`).join('');
  if (subj.classes.length === 1) draft.class_names = [subj.classes[0]];
}
function recordHint() {
  const v = $('frecord').value;
  $('frecordhint').textContent = v === 'none' ? 'Practice tests are not recorded in Assessments.'
    : `When you close the test and have marked every written answer, scores go into Assessments as ${v === 'exam' ? 'the end-of-semester exam' : $('frecord').selectedOptions[0]?.textContent || 'this assessment'}, for each class. Students who did not take it are left blank.`;
}
$('fsubject').onchange = () => { draft.class_names = []; renderClasses(); };
$('frecord').onchange = recordHint;
$('fclasses').addEventListener('change', (e) => {
  const subj = me.subjects.find(x => x.subject === $('fsubject').value); if (!subj) return;
  if (e.target.dataset.allcls !== undefined) draft.class_names = e.target.checked ? [...subj.classes] : [];
  else draft.class_names = [...document.querySelectorAll('[data-cls]:checked')].map(c => c.dataset.cls);
  renderClasses();
});
function countLabel() {
  const n = draft.questions.length, m = draft.questions.reduce((t, x) => t + (Number(x.marks) || 0), 0);
  $('qcount').textContent = `(${n} question${n === 1 ? '' : 's'}, ${m} mark${m === 1 ? '' : 's'})`;
}
function renderQs() {
  countLabel();
  $('qs').innerHTML = draft.questions.map((q, i) => `
    <div class="q" data-i="${i}">
      <div class="row between"><strong>${i + 1}. ${q.type === 'short' ? 'Short answer' : 'Objective'}</strong>
        <div class="row"><label class="row" style="display:flex">Marks <input data-f="marks" value="${esc(q.marks)}" inputmode="decimal" style="width:80px"></label>
          <button class="link" data-up="${i}" ${i === 0 ? 'disabled' : ''}>Move up</button><button class="link danger" data-rm="${i}">Remove</button></div></div>
      <textarea data-f="text" placeholder="Question">${esc(q.text)}</textarea>
      ${(q.images || []).length ? `<div class="pics">${q.images.map((u, n) => `<figure><img src="${esc(u)}" alt="Picture ${n + 1}"><figcaption>Picture ${n + 1}: type <code>[image ${n + 1}]</code> where it goes. <button class="link danger" data-rmimg="${i}:${n}">Remove</button></figcaption></figure>`).join('')}</div>` : ''}
      <div class="row"><button class="link" data-addimg="${i}" ${(q.images || []).length >= 6 ? 'disabled' : ''}>Add picture</button>
        <span class="muted">${(q.images || []).length ? 'Pictures not placed with [image N] show under the question.' : ''}</span></div>
      ${q.type === 'short' ? `<textarea data-f="explanation" placeholder="Marking guide for you (students don't see it)">${esc(q.explanation)}</textarea>` : `
        ${q.options.map((o, k) => `<div class="opt"><input type="radio" name="c${i}" data-correct="${k}" ${q.correct === LET[k].toLowerCase() ? 'checked' : ''} aria-label="${LET[k]} is the answer"><strong>${LET[k]}</strong><input data-opt="${k}" value="${esc(o)}" placeholder="Option ${LET[k]}${(q.option_images || [])[k] ? ' (optional with a picture)' : ''}">
          ${(q.option_images || [])[k] ? '' : `<button class="link" data-optimg="${i}:${k}" aria-label="Add a picture to option ${LET[k]}">Picture</button>`}</div>
          ${(q.option_images || [])[k] ? `<div class="optimg"><img src="${esc(q.option_images[k])}" alt="Picture for option ${LET[k]}"><button class="link danger" data-rmoptimg="${i}:${k}">Remove picture</button></div>` : ''}`).join('')}
        <div class="row">${q.options.length < 5 ? `<button class="link" data-addopt="${i}">Add option</button>` : ''}${q.options.length > 2 ? `<button class="link" data-rmopt="${i}">Remove last option</button>` : ''}</div>
        <input data-f="explanation" value="${esc(q.explanation)}" placeholder="Explanation shown after submitting (optional)">`}
    </div>`).join('') || '<p class="muted">No questions yet.</p>';
}
$('qs').addEventListener('input', (e) => {
  const box = e.target.closest('[data-i]'); if (!box) return; const q = draft.questions[box.dataset.i];
  if (e.target.dataset.f) q[e.target.dataset.f] = e.target.value;
  if (e.target.dataset.opt) q.options[e.target.dataset.opt] = e.target.value;
  if (e.target.dataset.correct !== undefined) q.correct = LET[e.target.dataset.correct].toLowerCase();
  if (e.target.dataset.f === 'marks') countLabel();
});
$('qs').addEventListener('change', (e) => { if (e.target.dataset.correct !== undefined) { const q = draft.questions[e.target.closest('[data-i]').dataset.i]; q.correct = LET[e.target.dataset.correct].toLowerCase(); } });
$('qs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rm) draft.questions.splice(+b.dataset.rm, 1);
  else if (b.dataset.up) { const i = +b.dataset.up; [draft.questions[i - 1], draft.questions[i]] = [draft.questions[i], draft.questions[i - 1]]; }
  else if (b.dataset.addopt) draft.questions[+b.dataset.addopt].options.push('');
  else if (b.dataset.addimg) { pickPicture({ i: +b.dataset.addimg }); return; }
  else if (b.dataset.optimg) { const [qi, k] = b.dataset.optimg.split(':').map(Number); pickPicture({ i: qi, k }); return; }
  else if (b.dataset.rmimg) { const [qi, n] = b.dataset.rmimg.split(':').map(Number); draft.questions[qi].images.splice(n, 1); }
  else if (b.dataset.rmoptimg) { const [qi, k] = b.dataset.rmoptimg.split(':').map(Number); draft.questions[qi].option_images[k] = null; }
  else if (b.dataset.rmopt) { const q = draft.questions[+b.dataset.rmopt]; const gone = LET[q.options.length - 1].toLowerCase(); q.options.pop(); if (q.option_images) q.option_images.length = Math.min(q.option_images.length, q.options.length); if (q.correct === gone) q.correct = ''; }
  else return;
  renderQs();
});
let picTarget = null;
function pickPicture(target) { picTarget = target; $('imgfile').value = ''; $('imgfile').click(); }
async function shrink(file) {
  // Phone photos are large: keep at most 1600 px on the long side as JPEG. Small files and GIFs go as they are.
  if (file.type === 'image/gif' || file.size < 400 * 1024) return file;
  const img = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise(ok => c.toBlob(b => ok(b || file), 'image/jpeg', 0.85));
}
$('imgfile').onchange = async () => {
  const file = $('imgfile').files[0]; const t = picTarget; if (!file || !t) return;
  msg($('edmsg'), 'Adding the picture…', 'info');
  try {
    const blob = await shrink(file);
    const r = await fetch('/lms/teacher/images', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': blob.type || file.type }, body: blob });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'The picture could not be added.');
    const q = draft.questions[t.i];
    if (t.k == null) { q.images = q.images || []; q.images.push(d.url); }
    else { q.option_images = q.option_images || []; q.option_images[t.k] = d.url; }
    msg($('edmsg'), '', ''); renderQs();
  } catch (err) { msg($('edmsg'), err.message, 'bad'); }
};
$('addmcq').onclick = () => { draft.questions.push(blankQ('mcq')); renderQs(); };
$('addshort').onclick = () => { draft.questions.push(blankQ('short')); renderQs(); };

// Past Questions picker
let pascoQs = [];
$('addpasco').onclick = async () => {
  $('pasco').hidden = false;
  const d = await api('/lms/teacher/pasco');
  $('psubject').innerHTML = d.subjects.length ? '<option value="">Choose a subject</option>' + d.subjects.map(s => `<option value="${esc(s.slug)}">${esc(s.name)} (${s.count})</option>`).join('') : '<option value="">No past questions on this server yet</option>';
  $('plist').innerHTML = ''; $('pnote').textContent = '';
};
$('pclose').onclick = () => { $('pasco').hidden = true; };
$('psubject').onchange = async () => {
  if (!$('psubject').value) return;
  const d = await api(`/lms/teacher/pasco?subject=${encodeURIComponent($('psubject').value)}`);
  pascoQs = d.questions;
  $('plist').innerHTML = pascoQs.map((q, i) => `<label><input type="checkbox" data-pq="${i}"><span><span class="muted">${esc(q.paper)}${q.no ? `, question ${q.no}` : ''}${q.type === 'short' ? ', theory' : ''}${q.has_picture ? ', has a picture' : ''}</span><br>${esc(q.text.slice(0, 220))}</span></label>`).join('');
};
$('padd').onclick = () => {
  const picked = [...document.querySelectorAll('[data-pq]:checked')].map(c => pascoQs[c.dataset.pq]);
  for (const q of picked) {
    draft.questions.push(q.type === 'short'
      ? { type: 'short', text: q.text, marks: 5, explanation: q.marking_scheme || '', images: (q.images || []).filter(Boolean) }
      : { type: 'mcq', text: q.text, options: q.options.slice(0, 5), option_images: (q.option_images || []).slice(0, 5), correct: q.correct || '', marks: 1, explanation: q.explanation || '', images: (q.images || []).filter(Boolean) });
  }
  $('pnote').textContent = picked.length ? `Added ${picked.length}.` : 'Tick the questions to add.';
  document.querySelectorAll('[data-pq]:checked').forEach(c => { c.checked = false; });
  renderQs();
};

async function save(open) {
  const rec = $('frecord').value;
  Object.assign(draft, { title: $('ftitle').value, subject: $('fsubject').value, time_limit_mins: $('ftime').value,
    instructions: $('finstr').value, show_answers: $('fshow').checked, randomise: $('frand').checked,
    record_as: rec.startsWith('ca:') ? 'ca' : rec, mode_id: rec.startsWith('ca:') ? rec.slice(3) : null });
  if (!draft.questions.length && open) return msg($('edmsg'), 'Add at least one question before opening the test.', 'bad');
  try {
    let id = editing;
    if (id) await api(`/lms/teacher/tests/${id}`, { method: 'PUT', body: JSON.stringify(draft) });
    else id = (await api('/lms/teacher/tests', { method: 'POST', body: JSON.stringify(draft) })).id;
    if (open) await api(`/lms/teacher/tests/${id}/status`, { method: 'POST', body: JSON.stringify({ status: 'open' }) });
    listTests();
  } catch (err) { msg($('edmsg'), err.message, 'bad'); }
}
$('saveopen').onclick = () => save(true);
$('savedraft').onclick = () => save(false);

// ── Results ──
$('rback').onclick = () => listTests();
async function openResults(id) {
  resId = id; show('v-res'); await renderResults();
  clearInterval(resTimer);
  resTimer = setInterval(() => { if (!document.activeElement || !document.activeElement.matches('#rmark input')) renderResults(); }, 5000);
}
async function renderResults() {
  const r = await api(`/lms/teacher/tests/${resId}/results`);
  const t = r.test, s = r.summary;
  $('rtitle').textContent = t.title;
  $('rsub').textContent = `${t.class_name}, ${t.total_marks} marks. ${t.status === 'open' ? 'Open: students can take it now.' : t.status === 'closed' ? 'Closed.' : 'Draft.'}`
    + (t.record_as ? ` ${t.record_note || (t.status === 'closed' ? (r.marking.some(m => m.marks == null) ? 'Mark every written answer, then the scores go into Assessments.' : 'Scores go into Assessments when the server is next online.') : `Scores go into Assessments as ${t.record_as === 'exam' ? 'the exam' : t.mode_name || 'a CA assessment'} when you close it.`)}` : '');
  $('rstats').innerHTML = `
    <div class="stat"><div class="big">${s.submitted}/${s.class_size}</div><div class="muted">submitted</div></div>
    <div class="stat"><div class="big">${s.taking}</div><div class="muted">taking it now</div></div>
    <div class="stat"><div class="big">${s.average == null ? 'None' : `${s.average.toFixed(1)}/${t.total_marks}`}</div><div class="muted">average so far</div></div>`;
  $('ractions').innerHTML = t.status === 'open' ? `<button data-status="closed" data-id="${t.id}">Close test (submits unfinished answers)</button>` : `<button class="primary" data-status="open" data-id="${t.id}">Open again</button>`;
  $('rrows').innerHTML = r.students.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.class_name || '')}</td><td>${esc(x.state)}${x.to_mark ? ', to mark' : ''}</td><td>${x.score == null ? '' : `${+x.score.toFixed(2)}/${x.max_score}`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No students in these classes on the server.</td></tr>';
  $('rmarkcard').hidden = !r.marking.length;
  $('rmark').innerHTML = r.marking.map(m => `
    <div class="q"><div class="muted">${esc(m.student)}: ${esc(m.question.slice(0, 140))}</div><div style="white-space:pre-wrap">${esc(m.answer)}</div>
      <div class="row"><label class="row" style="display:flex">Marks (0 to ${m.max}) <input style="width:90px" inputmode="decimal" value="${m.marks ?? ''}" data-a="${m.attempt_id}" data-q="${m.question_id}" data-max="${m.max}"></label>
      <button data-savemark="1">Save</button><span class="muted">${m.marks == null ? 'Not marked' : 'Marked'}</span></div></div>`).join('');
}
$('rmark').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-savemark]'); if (!b) return;
  const inp = b.parentElement.querySelector('input');
  try { await api('/lms/teacher/marks', { method: 'PUT', body: JSON.stringify({ attempt_id: inp.dataset.a, question_id: inp.dataset.q, marks: inp.value }) }); b.textContent = 'Saved'; setTimeout(renderResults, 600); }
  catch (err) { b.nextElementSibling.textContent = err.message; }
});
$('ractions').addEventListener('click', () => setTimeout(renderResults, 400));
$('rcsv').onclick = async () => {
  const r = await fetch(`/lms/teacher/tests/${resId}/results.csv`, { headers: { Authorization: `Bearer ${token}` } });
  const blob = await r.blob(); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${$('rtitle').textContent} results.csv`; document.body.appendChild(a); a.click(); a.remove();
};

// Opened from CAS (Offline Assessment in the teacher portal or app): the address
// ends in #ticket=..., a one-time sign-in pass. Use it, then drop it from the address.
(async () => {
  const m = location.hash.match(/ticket=([A-Za-z0-9_.-]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname);
    try {
      const r = await fetch('/lms/teacher/ticket', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket: m[1] }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { token = d.token; try { localStorage.setItem('cas_teacher_token', token); } catch {} }
      else if (!token) { start(); msg($('lmsg'), d.error || 'Sign in with your teacher code and password.', 'info'); return; }
    } catch { /* fall back to the saved sign-in or the form */ }
  }
  start();
})();
</script>
